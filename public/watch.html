<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeetRec — Watch Recording</title>
  <meta name="description" content="Watch a shared MeetRec recording." />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="ambient"></div>
  <div class="page">

    <nav class="nav">
      <div class="nav-logo">
        <div class="nav-logo-icon">🔴</div>
        MeetRec
      </div>
      <div class="nav-actions">
        <a href="/" class="btn btn-ghost btn-sm">Dashboard</a>
      </div>
    </nav>

    <!-- Loading state -->
    <div id="loadingState" style="text-align:center; padding:80px 24px; color: var(--text3);">
      <div style="font-size:48px; margin-bottom:16px; animation: spin 1s linear infinite; display:inline-block;">⏳</div>
      <p>Loading recording…</p>
    </div>

    <!-- Error state -->
    <div id="errorState" class="empty-state" style="display:none">
      <div class="icon">⚠️</div>
      <h3>Recording Not Found</h3>
      <p>This link may be invalid or the recording may have been deleted.</p>
      <a href="/" class="btn btn-primary">Go to Dashboard</a>
    </div>

    <!-- Player -->
    <div class="player-wrap" id="playerWrap" style="display:none">

      <div class="player-meta">
        <h1 id="recordingTitle">Recording</h1>
        <div class="meta-row">
          <span>📅 <span id="recordingDate">—</span></span>
          <span>⏱ <span id="recordingDuration">—</span></span>
          <span>💾 <span id="recordingSize">—</span></span>
        </div>
      </div>

      <div class="video-container">
        <video id="videoPlayer" controls playsinline preload="metadata"></video>
      </div>

      <div class="player-actions">
        <a id="downloadBtn" href="#" download class="btn btn-primary btn-lg">
          ⬇️ Download
        </a>
        <button class="btn btn-ghost btn-lg" id="shareThisBtn">
          📤 Copy Share Link
        </button>
      </div>

      <!-- Share box -->
      <div style="margin-top: 24px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);">
        <div style="font-size:13px; color:var(--text3); margin-bottom:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Share with meeting participants</div>
        <div class="share-box">
          <input type="text" class="share-input" id="shareLinkDisplay" readonly />
          <button class="btn btn-primary" id="copyShareBtn">Copy Link</button>
        </div>
        <div style="font-size:12px; color:var(--text3); margin-top:8px;">
          ✅ Anyone with this link can watch the recording — no login required
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script src="/js/player.js"></script>
</body>
</html>
